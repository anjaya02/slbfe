<div class="reset-password-modal">
  <div class="modal-header">
    <h2>Reset Password</h2>
    <button mat-icon-button (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body">
    <form [formGroup]="passwordForm" (ngSubmit)="save()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Current Password</mat-label>
        <input
          matInput
          formControlName="currentPassword"
          [type]="showCurrentPassword ? 'text' : 'password'"
          autocomplete="current-password"
        />
        <mat-icon matPrefix>lock_open</mat-icon>
        <button
          mat-icon-button
          matSuffix
          type="button"
          class="password-toggle"
          [attr.aria-label]="
            showCurrentPassword
              ? 'Hide current password'
              : 'Show current password'
          "
          [matTooltip]="
            showCurrentPassword
              ? 'Hide current password'
              : 'Show current password'
          "
          (click)="toggleCurrentPasswordVisibility()"
        >
          <mat-icon>{{
            showCurrentPassword ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
        <mat-error
          *ngIf="passwordForm.get('currentPassword')?.hasError('required')"
          >Current password is required</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>New Password</mat-label>
        <input
          matInput
          formControlName="newPassword"
          [type]="showNewPassword ? 'text' : 'password'"
          autocomplete="new-password"
        />
        <mat-icon matPrefix>lock</mat-icon>
        <button
          mat-icon-button
          matSuffix
          type="button"
          class="password-toggle"
          [attr.aria-label]="
            showNewPassword ? 'Hide new password' : 'Show new password'
          "
          [matTooltip]="
            showNewPassword ? 'Hide new password' : 'Show new password'
          "
          (click)="toggleNewPasswordVisibility()"
        >
          <mat-icon>{{
            showNewPassword ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
        <mat-error
          *ngIf="passwordForm.get('newPassword')?.hasError('required')"
          >New password is required</mat-error
        >
        <mat-error *ngIf="passwordForm.get('newPassword')?.hasError('minlength')"
          >Minimum 8 characters</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input
          matInput
          formControlName="confirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          autocomplete="new-password"
        />
        <mat-icon matPrefix>lock_reset</mat-icon>
        <button
          mat-icon-button
          matSuffix
          type="button"
          class="password-toggle"
          [attr.aria-label]="
            showConfirmPassword
              ? 'Hide confirm password'
              : 'Show confirm password'
          "
          [matTooltip]="
            showConfirmPassword
              ? 'Hide confirm password'
              : 'Show confirm password'
          "
          (click)="toggleConfirmPasswordVisibility()"
        >
          <mat-icon>{{
            showConfirmPassword ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
        <mat-error
          *ngIf="passwordForm.get('confirmPassword')?.hasError('required')"
          >Confirm password is required</mat-error
        >
        <mat-error
          *ngIf="
            passwordForm.get('confirmPassword')?.hasError('passwordMismatch') &&
            passwordForm.get('confirmPassword')?.touched
          "
          >Passwords do not match</mat-error
        >
      </mat-form-field>

      <div class="modal-actions">
        <button mat-button type="button" (click)="close()">Cancel</button>
        <button
          mat-raised-button
          class="btn-save"
          type="submit"
          [disabled]="saving || passwordForm.invalid"
        >
          <mat-spinner *ngIf="saving" diameter="18"></mat-spinner>
          <span *ngIf="!saving">Update Password</span>
        </button>
      </div>
    </form>
  </div>
</div>
